<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="TaskFlow — a premium task management dashboard. Organize your work. Stay productive."
    />
    <title>TaskFlow — Organize your work. Stay productive.</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('taskflow_theme');
          var theme =
            stored === '"dark"' || stored === 'dark'
              ? 'dark'
              : stored === '"light"' || stored === 'light'
                ? 'light'
                : window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.classList.toggle('light', theme !== 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage unavailable — fall back to light theme */
        }
      })();
    </script>
